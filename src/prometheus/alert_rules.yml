groups:
  - name: do9_critical_alerts
    interval: 15s
    rules:

      - alert: LowAvailableMemory
        expr: node_memory_MemAvailable_bytes < 100 * 1024 * 1024
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Низкая доступная память на {{ $labels.instance }}"
          description: "Доступная память {{ $value | humanize1024 }}B меньше 100 МБ"

      - alert: HighUsedMemory
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) > 1 * 1024 * 1024 * 1024
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Высокое использование RAM на {{ $labels.instance }}"
          description: "Используется {{ $value | humanize1024 }}B (> 1 ГБ)"

      - alert: HighServiceCPU
        expr: sum by(container_label_com_docker_swarm_service_name) (rate(container_cpu_usage_seconds_total{container_label_com_docker_swarm_service_name!=""}[1m])) > 0.10
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Высокая загрузка CPU сервиса {{ $labels.container_label_com_docker_swarm_service_name }}"
          description: "Загрузка {{ $value | humanizePercentage }} (> 10%)"























# Конфигурация критических алертов Prometheus

## Построчный разбор с комментариями

```yaml
groups:
  # Корневой ключ: список групп алертов. Группы нужны для логической организации и общих параметров
  - name: do9_critical_alerts
    # Имя группы алертов — отображается в Prometheus UI и используется для идентификации
    interval: 15s
    # Интервал, с которым Prometheus вычисляет выражения правил этой группы (каждые 15 секунд)
    rules:
      # Список правил алертов внутри группы

      - alert: LowAvailableMemory
        # Имя алерта — будет показано в Alertmanager и уведомлениях
        expr: node_memory_MemAvailable_bytes < 100 * 1024 * 1024
        # PromQL-выражение: метрика доступной памяти от node_exporter меньше 100 МБ (в байтах)
        for: 30s
        # Алерт сработает только если условие истинно непрерывно 30 секунд — защита от ложных срабатываний (флапов)
        labels:
          severity: critical
          # Метка важности — critical означает критический уровень, используется для маршрутизации в Alertmanager
        annotations:
          # Аннотации — это человекочитаемая информация для уведомлений
          summary: "Низкая доступная память на {{ $labels.instance }}"
          # Краткое описание, {{ $labels.instance }} подставляет имя инстанса, где сработал алерт
          description: "Доступная память {{ $value | humanize1024 }}B меньше 100 МБ"
          # Подробное описание, $value — текущее значение метрики, humanize1024 форматирует байты в человекочитаемый вид (МБ, ГБ)

      - alert: HighUsedMemory
        # Алерт на высокое использование оперативной памяти
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) > 1 * 1024 * 1024 * 1024
        # Вычисляем использованную память (всего минус доступно) и сравниваем с 1 ГБ
        for: 30s
        # Условие должно сохраняться 30 секунд
        labels:
          severity: warning
          # Уровень warning — менее серьёзный, чем critical, обычно не требует немедленного вмешательства
        annotations:
          summary: "Высокое использование RAM на {{ $labels.instance }}"
          description: "Используется {{ $value | humanize1024 }}B (> 1 ГБ)"
          # Аналогично выводим текущее значение в удобочитаемом формате

      - alert: HighServiceCPU
        # Алерт на высокую загрузку CPU конкретным сервисом Docker Swarm
        expr: sum by(container_label_com_docker_swarm_service_name) (rate(container_cpu_usage_seconds_total{container_label_com_docker_swarm_service_name!=""}[1m])) > 0.10
        # Разбор выражения:
        # - container_cpu_usage_seconds_total — счётчик использованного CPU контейнерами (от cAdvisor)
        # - {container_label_com_docker_swarm_service_name!=""} — фильтр: только контейнеры, принадлежащие сервисам Swarm
        # - rate(...[1m]) — скорость прироста счётчика за последнюю минуту = доля использованного CPU
        # - sum by(...) — суммируем по имени сервиса Swarm (агрегируем все реплики сервиса)
        # - > 0.10 — порог 10% от одного ядра CPU
        for: 30s
        # Условие должно сохраняться полминуты
        labels:
          severity: warning
        annotations:
          summary: "Высокая загрузка CPU сервиса {{ $labels.container_label_com_docker_swarm_service_name }}"
          # Подставляем имя сервиса Swarm из метки
          description: "Загрузка {{ $value | humanizePercentage }} (> 10%)"
          # humanizePercentage форматирует число (0.15) как процент (15%)
```

---

## Краткий монолог для защиты

Этот файл — конфигурация правил алертинга для Prometheus, описывающая три критических правила мониторинга инфраструктуры на Docker Swarm. Все правила объединены в одну группу `do9_critical_alerts` с интервалом проверки 15 секунд. Первое правило `LowAvailableMemory` отслеживает падение доступной памяти ниже 100 МБ и имеет уровень critical, поскольку нехватка RAM может привести к OOM-killer и падению сервисов. Второе правило `HighUsedMemory` срабатывает при потреблении более 1 ГБ оперативной памяти с уровнем warning. Третье правило `HighServiceCPU` использует метрики от cAdvisor и агрегирует загрузку CPU по сервисам Docker Swarm через `sum by`, что позволяет видеть нагрузку не отдельных контейнеров, а целиком сервиса со всеми его репликами. Параметр `for: 30s` во всех правилах защищает от ложных срабатываний на кратковременных пиках — алерт сработает только если проблема устойчива. Шаблонизация через `{{ $labels.instance }}` и `{{ $value | humanize1024 }}` делает уведомления информативными и читаемыми для человека.

---

## Возможные вопросы на защите и ответы

**1. Что такое PromQL?**
Это язык запросов Prometheus (Prometheus Query Language) — функциональный язык для выборки и агрегации метрик временных рядов.

**2. Зачем нужен параметр `for`?**
Он указывает, как долго условие должно быть истинным, прежде чем алерт перейдёт в состояние firing. Это защита от флапов (мгновенных скачков), которые не являются реальными проблемами.

**3. В каких состояниях может находиться алерт?**
Три состояния: `inactive` (условие ложно), `pending` (условие истинно, но ещё не прошло время `for`), `firing` (условие истинно дольше `for`, алерт отправлен).

**4. Откуда берутся метрики `node_memory_*`?**
Их предоставляет `node_exporter` — экспортер Prometheus для метрик ОС (CPU, память, диски, сеть).

**5. Откуда берутся метрики `container_*`?**
Из cAdvisor (Container Advisor) — компонента, который собирает метрики использования ресурсов контейнерами Docker.

**6. Почему используется `rate(...)`, а не просто значение метрики?**
Метрика `container_cpu_usage_seconds_total` — это counter (счётчик), он только растёт. `rate()` вычисляет скорость роста за интервал, что и даёт реальную загрузку CPU в виде доли (0.10 = 10% одного ядра).

**7. Что значит `sum by(...)`?**
Это агрегация: суммируем значения по группам с одинаковым значением указанной метки. В нашем случае — суммируем загрузку CPU всех контейнеров одного сервиса Swarm.

**8. Почему 0.10 = 10%?**
`rate()` для CPU возвращает долю использованного процессорного времени. 0.10 означает использование 10% времени одного ядра. Если контейнер использует 2 ядра полностью, значение будет 2.0.

**9. Разница между severity: critical и warning?**
Это пользовательская метка, которую Alertmanager использует для маршрутизации. Critical обычно отправляется немедленно по всем каналам (SMS, звонок), warning — только в чат/email.

**10. Что такое `humanize1024` и `humanizePercentage`?**
Это шаблонные функции Prometheus: `humanize1024` форматирует число в единицах кратных 1024 (KiB, MiB, GiB), `humanizePercentage` умножает на 100 и добавляет знак процента.

**11. Куда отправляются эти алерты?**
Prometheus сам алерты не отправляет — он передаёт их в Alertmanager, который уже маршрутизирует уведомления в Slack, Telegram, email, PagerDuty и т.д.

**12. Почему интервал группы 15 секунд?**
Это компромисс между быстротой реакции и нагрузкой на Prometheus. Слишком частая проверка нагружает систему, слишком редкая — задерживает обнаружение проблем.

**13. Можно ли динамически менять пороги?**
Не в самих правилах, но через label-фильтры и шаблоны Alertmanager можно делать разную маршрутизацию. Для динамики порогов используют рекординг-правила или внешние системы.

**14. Что произойдёт, если метрика отсутствует?**
Выражение вернёт пустой результат и алерт не сработает. Поэтому отдельно делают алерты типа `up == 0` для проверки доступности самих экспортеров.

**15. Почему фильтр `container_label_com_docker_swarm_service_name!=""`?**
Чтобы исключить системные контейнеры, не относящиеся к сервисам Swarm (например, контейнеры, запущенные напрямую через `docker run`). Алерт фокусируется только на сервисах кластера.