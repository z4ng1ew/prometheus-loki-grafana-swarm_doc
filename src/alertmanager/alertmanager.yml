## Ответы на возможные вопросы

**В: Почему используется порт 587, а не 465?**
О: Порт 587 — стандартный порт для SMTP с STARTTLS (явное повышение соединения до TLS). Порт 465 — устаревший implicit TLS. Alertmanager лучше работает с 587 + `smtp_require_tls: true`.

**В: Что такое App Password и почему не используется обычный пароль?**
О: Gmail с включённой двухфакторной аутентификацией не позволяет входить по обычному паролю из сторонних приложений. App Password — это 16-символьный одноразовый пароль, сгенерированный в настройках Google-аккаунта специально для таких случаев.

**В: Зачем нужен `group_wait`?**
О: Чтобы при массовом срабатывании алертов (например, падение ноды вызывает 10 алертов) они были сгруппированы в одно уведомление, а не пришли 10 отдельных писем.

**В: Что произойдёт, если webhook-сервер недоступен?**
О: Alertmanager повторит отправку согласно встроенной логике retry. Email-уведомление при этом уйдёт независимо — каналы работают параллельно.

**В: Зачем нужен inhibition?**
О: Если сервис полностью недоступен (critical), нет смысла параллельно уведомлять о высокой задержке ответа (warning) того же сервиса — это избыточный шум.

**В: Что приходит на webhook?**
О: Alertmanager отправляет HTTP POST-запрос с JSON-телом, содержащим все метки, аннотации, статус, время срабатывания и группу алертов. Это позволяет написать кастомный обработчик (бот Telegram, Slack, система тикетов и т.д.).

**В: Почему `repeat_interval` — 5 минут?**
О: Это достаточно агрессивный интервал, обеспечивающий напоминание о неразрешённой проблеме. В production обычно ставят 1–4 часа, но для учебного стенда 5 минут позволяют быстро проверить работоспособность.

**В: Что означает `{{ .GroupLabels.alertname }}` в Subject?**
О: Это Go-template синтаксис. Alertmanager подставляет реальное имя алерта и его статус (firing/resolved) в тему письма, что позволяет сразу видеть суть проблемы, не открывая письмо.