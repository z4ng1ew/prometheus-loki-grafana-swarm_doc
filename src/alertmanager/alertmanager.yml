## Монолог для защиты

Данный файл представляет собой конфигурацию Alertmanager — компонента стека мониторинга Prometheus, отвечающего за обработку, маршрутизацию, группировку, дедупликацию и доставку уведомлений об инцидентах. Файл настраивает двухканальную систему оповещения: алерты, сгенерированные Prometheus по заданным правилам, поступают в Alertmanager, который группирует их по имени, выжидает 10 секунд для накопления связанных событий, а затем одновременно отправляет уведомление на электронную почту через SMTP-сервер Gmail и на внешний webhook-эндпоинт в формате JSON. Ключевой особенностью конфигурации является механизм inhibition — подавление предупреждений при наличии критических алертов с тем же именем, что исключает информационный шум и позволяет инженеру сосредоточиться на наиболее серьёзных проблемах. Параметр `send_resolved: true` обеспечивает отправку уведомлений не только при возникновении, но и при разрешении инцидента, что даёт полную картину жизненного цикла алерта. Повторная отправка неразрешённых алертов каждые 5 минут гарантирует, что критическое событие не будет пропущено.

