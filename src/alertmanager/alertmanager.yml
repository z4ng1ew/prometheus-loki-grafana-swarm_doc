```yaml
# ===========================
# Конфигурация Alertmanager
# ===========================

# Глобальные настройки, применяемые ко всем получателям уведомлений
global:
  # Адрес SMTP-сервера и порт для отправки email-уведомлений (Gmail, порт 587 — TLS)
  smtp_smarthost: 'smtp.gmail.com:587'
  # Адрес отправителя, от имени которого будут приходить письма
  smtp_from: 'paturlembo@gmail.com'
  # Логин для аутентификации на SMTP-сервере
  smtp_auth_username: 'paturlembo@gmail.com'
  # Пароль приложения Gmail (App Password, не основной пароль аккаунта)
  smtp_auth_password: 'ytmiqztqhocvdrmp'
  # Обязательное использование TLS-шифрования при отправке писем
  smtp_require_tls: true

# Дерево маршрутизации — определяет, как алерты группируются и куда направляются
route:
  # Группировка алертов по имени (одинаковые alertname попадают в одно уведомление)
  group_by: ['alertname']
  # Время ожидания перед отправкой первого уведомления (накопление алертов в группу)
  group_wait: 10s
  # Интервал между отправками уведомлений, если в группу добавились новые алерты
  group_interval: 30s
  # Интервал повторной отправки уже отправленного уведомления, если алерт не разрешён
  repeat_interval: 5m
  # Получатель по умолчанию — все алерты идут в канал 'multichannel'
  receiver: 'multichannel'

# Список получателей уведомлений
receivers:
  # Получатель 'multichannel' — объединяет email и webhook в одном канале
  - name: 'multichannel'

    # Настройка отправки уведомлений по электронной почте
    email_configs:
      # Адрес получателя email-уведомлений
      - to: 'z4ng1ew@gmail.com'
        # Отправлять уведомление и при срабатывании, и при разрешении алерта
        send_resolved: true
        # Кастомный заголовок письма с именем алерта и текущим статусом (firing/resolved)
        headers:
          Subject: '[DO9 Alert] {{ .GroupLabels.alertname }} ({{ .Status }})'

    # Настройка отправки уведомлений через webhook (HTTP POST-запрос)
    webhook_configs:
      # URL, на который отправляется JSON с данными алерта (например, кастомный обработчик)
      - url: 'http://192.168.56.1:8080/'
        # Также отправлять уведомление при разрешении алерта
        send_resolved: true

# Правила подавления (inhibition) — предотвращают дублирование уведомлений
inhibit_rules:
  # Если существует алерт с severity='critical', то алерт с severity='warning'
  # и тем же именем (alertname) будет подавлен — не отправится получателю
  - source_match:
      severity: 'critical'    # Источник подавления — критический алерт
    target_match:
      severity: 'warning'     # Цель подавления — предупреждающий алерт
    equal: ['alertname']      # Подавление срабатывает только при совпадении имени алерта
```

