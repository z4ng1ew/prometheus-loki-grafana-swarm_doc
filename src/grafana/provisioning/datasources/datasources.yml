## Монолог для защиты

Данный файл представляет собой конфигурацию автоматического провижининга источников данных Grafana, размещаемую в директории `provisioning/datasources/`. Его назначение — избавить от необходимости вручную добавлять источники данных через веб-интерфейс при каждом новом развёртывании: при старте контейнера Grafana считывает этот YAML и автоматически регистрирует два источника. Первый — Prometheus, основная система сбора и хранения временных рядов (метрик), он помечен как `isDefault`, что означает его автоматический выбор при создании новых дашбордов и панелей. Второй — Loki, система агрегации логов, позволяющая в рамках одного интерфейса Grafana коррелировать метрики с логами, что критически важно при расследовании инцидентов. Оба источника используют режим `access: proxy`, при котором все запросы к Prometheus и Loki проходят через backend Grafana, а не напрямую из браузера пользователя — это повышает безопасность, так как конечный пользователь не имеет прямого сетевого доступа к внутренним сервисам мониторинга. Обращение к сервисам происходит по DNS-именам Docker-сети (`prometheus`, `loki`), что обеспечивает работоспособность в контейнерной среде без привязки к IP-адресам.

