## Ответы на возможные вопросы

**В: Что такое провижининг (provisioning) в Grafana?**
О: Это механизм декларативной конфигурации, позволяющий при запуске Grafana автоматически создавать источники данных, дашборды и политики уведомлений из YAML-файлов, без ручного вмешательства через UI. Это принцип Infrastructure as Code.

**В: Почему `access: proxy`, а не `direct`?**
О: В режиме `proxy` запросы к Prometheus/Loki идут через сервер Grafana. В режиме `direct` браузер пользователя обращается к источнику напрямую — это требует сетевой доступности Prometheus/Loki из браузера, что в Docker-среде невозможно (внутренние сервисы недоступны извне) и небезопасно.

**В: Почему URL содержит `http://prometheus:9090`, а не IP-адрес?**
О: В Docker Compose сервисы общаются через встроенный DNS-резолвер. Имя `prometheus` резолвится в IP контейнера автоматически. Это устраняет хардкод IP-адресов и обеспечивает работоспособность при пересоздании контейнеров.

**В: Зачем нужен `isDefault: true`?**
О: Когда пользователь создаёт новую панель в Grafana, ему не нужно каждый раз вручную выбирать источник данных — Prometheus будет подставлен автоматически как основной.

**В: Что будет, если убрать `editable: true`?**
О: Источник данных станет доступным только для чтения в веб-интерфейсе. Изменить его настройки можно будет только через этот YAML-файл с последующим перезапуском Grafana. В production это предпочтительно для защиты от случайных изменений.

**В: Зачем нужен Loki, если есть Prometheus?**
О: Prometheus хранит метрики (числовые временные ряды: CPU, память, количество запросов). Loki хранит логи (текстовые записи приложений). Вместе они дают полную картину: метрики показывают *что* произошло, логи — *почему*.

**В: Что такое `apiVersion: 1`?**
О: Это версия формата файла провижининга Grafana. На данный момент единственная поддерживаемая версия — `1`. Поле обязательно для корректного парсинга файла.

**В: Можно ли добавить другие источники (InfluxDB, Elasticsearch)?**
О: Да, достаточно добавить ещё один элемент в список `datasources` с соответствующим `type` и `url`. Grafana поддерживает десятки встроенных и сторонних плагинов источников данных.