apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true








```yaml
# ===========================
# Конфигурация источников данных Grafana (Provisioning)
# ===========================

# Версия API провижининга Grafana (всегда 1 для текущих версий)
apiVersion: 1

# Список источников данных, которые будут автоматически добавлены при запуске Grafana
datasources:

  # --- Первый источник: Prometheus (метрики) ---
  # Человекочитаемое имя, отображаемое в интерфейсе Grafana
  - name: Prometheus
    # Тип плагина источника данных — Prometheus (сбор и хранение метрик)
    type: prometheus
    # Режим доступа: proxy — запросы идут через backend Grafana, а не из браузера клиента
    access: proxy
    # URL для подключения к Prometheus (имя сервиса в Docker-сети, порт по умолчанию)
    url: http://prometheus:9090
    # Этот источник будет использоваться по умолчанию при создании новых панелей
    isDefault: true
    # Разрешить редактирование настроек источника через веб-интерфейс Grafana
    editable: true

  # --- Второй источник: Loki (логи) ---
  # Человекочитаемое имя для источника логов
  - name: Loki
    # Тип плагина — Loki (система агрегации и хранения логов от Grafana Labs)
    type: loki
    # Режим доступа: proxy — аналогично, запросы проксируются через сервер Grafana
    access: proxy
    # URL для подключения к Loki (имя сервиса в Docker-сети, порт по умолчанию 3100)
    url: http://loki:3100
    # Разрешить редактирование настроек через UI
    editable: true
```

