# Конфигурация Promtail для сбора логов Docker-контейнеров

## Построчный разбор с комментариями

```yaml
server:
  # Секция настроек встроенного HTTP/gRPC сервера Promtail
  http_listen_port: 9080
  # Порт HTTP-сервера: используется для метрик (/metrics) и проверки готовности (/ready)
  grpc_listen_port: 0
  # Порт gRPC отключён (0 = выбрать случайный свободный порт, фактически не используется)

positions:
  # Секция настройки файла позиций — где Promtail хранит, до какого места он прочитал каждый лог
  filename: /tmp/positions.yaml
  # Путь к файлу позиций. Нужен, чтобы при перезапуске Promtail не читать логи заново
  # и не дублировать записи в Loki — продолжает с того места, где остановился

clients:
  # Список Loki-серверов, куда Promtail отправляет собранные логи
  - url: http://loki:3100/loki/api/v1/push
    # URL push-эндпоинта Loki. 'loki' — DNS-имя сервиса в Docker Swarm, 3100 — стандартный порт Loki

scrape_configs:
  # Список конфигураций сбора логов (по аналогии с Prometheus)
  
  - job_name: docker
    # Имя job'а — добавляется как метка ко всем собранным логам
    docker_sd_configs:
      # Docker Service Discovery — автоматическое обнаружение контейнеров через Docker API
      - host: unix:///var/run/docker.sock
        # Подключение к Docker daemon через Unix-сокет (монтируется в Promtail-контейнер)
        refresh_interval: 5s
        # Частота опроса Docker API на предмет новых/удалённых контейнеров

    relabel_configs:
      # Переписывание меток — превращение служебных меток Docker в удобные метки логов
      
      - source_labels: ['__meta_docker_container_name']
        # Берём исходную метку — имя контейнера (в формате /имя_контейнера)
        regex: '/(.*)'
        # Регулярка: захватываем всё, что после слэша, в первую группу
        target_label: 'container'
        # Сохраняем результат в новую метку 'container' (без ведущего слэша)

      - source_labels: ['__meta_docker_container_log_stream']
        # Метка из Docker — поток лога (stdout или stderr)
        target_label: 'logstream'
        # Копируем в метку 'logstream' для фильтрации логов по типу потока

      - source_labels: ['__meta_docker_container_label_com_docker_swarm_service_name']
        # Берём label контейнера, который ставит Swarm — имя сервиса в стеке
        target_label: 'service'
        # Сохраняем как метку 'service' — позволит в Grafana группировать логи по сервису Swarm
```

---

## Краткий монолог для защиты

Этот файл — конфигурация Promtail, агента, который собирает логи Docker-контейнеров и отправляет их в Loki — централизованное хранилище логов. Promtail работает по принципу аналогичному Prometheus: он динамически обнаруживает источники логов через Docker Service Discovery, подключаясь к Docker daemon через Unix-сокет с интервалом обновления 5 секунд. Особенность конфигурации — использование `relabel_configs` для извлечения полезных метаданных из Docker и превращения их в человекочитаемые метки: имя контейнера, поток вывода (stdout/stderr) и имя сервиса Docker Swarm. Эти метки потом используются в Grafana для фильтрации логов через LogQL (например, `{service="booking-service"}`). Файл позиций в `/tmp/positions.yaml` обеспечивает persistence — при перезапуске Promtail продолжает чтение логов с того места, где остановился, что предотвращает дублирование записей в Loki. Promtail запускается в Swarm в режиме `global` (по одному на каждый узел), чтобы собирать логи всех контейнеров кластера.

---

## Возможные вопросы на защите и ответы

**1. Что такое Promtail?**
Это агент сбора логов от создателей Loki (Grafana Labs). Аналог Filebeat/Fluentd, но специально заточенный под Loki. Обнаруживает источники логов, парсит их, добавляет метки и пушит в Loki.

**2. Что такое Loki?**
Это система централизованного логирования от Grafana Labs, спроектированная по принципу "Prometheus, но для логов". Индексирует только метки, а не содержимое логов, что делает её дешёвой по ресурсам.

**3. Чем Loki отличается от ELK (Elasticsearch)?**
Elasticsearch полнотекстово индексирует всё содержимое логов — мощно, но дорого по диску и памяти. Loki индексирует только метки, сами логи сжимаются в чанки. Дешевле, проще, но поиск менее гибкий.

**4. Зачем нужен файл positions.yaml?**
Promtail сохраняет в нём смещение (offset) прочитанных байт для каждого лог-файла. При перезапуске читает файл и продолжает с этой позиции, не теряя и не дублируя логи.

**5. Что такое Docker Service Discovery?**
Механизм, при котором Promtail периодически опрашивает Docker API и автоматически добавляет/удаляет источники логов по мере появления и исчезновения контейнеров.

**6. Зачем монтируется `/var/run/docker.sock`?**
Это Unix-сокет Docker daemon. Через него Promtail получает информацию о контейнерах и читает их логи. Сокет нужно монтировать в Promtail-контейнер как volume.

**7. Это не дыра в безопасности?**
Да, доступ к docker.sock эквивалентен root на хосте. В production используют socket-proxy или альтернативы. В учебных/dev-окружениях это приемлемый компромисс.

**8. Что такое `relabel_configs`?**
Механизм переписывания меток — изменение, добавление или удаление меток до отправки данных. Promtail унаследовал его от Prometheus.

**9. Почему имя контейнера начинается с `/`?**
Это исторический формат Docker API — все имена контейнеров возвращаются с ведущим слэшем. Через regex `/(.*)` мы его убираем.

**10. Что значат метки `__meta_*`?**
Это служебные (meta) метки, которые добавляет механизм Service Discovery. Они доступны только в `relabel_configs`, в финальные данные не попадают. Используются для извлечения нужной информации.

**11. Зачем разделять метки `container` и `service`?**
`container` — конкретный экземпляр (например, `app_booking-service.1.abc123`), `service` — общее имя сервиса в стеке (`app_booking-service`). Это позволяет смотреть логи как одной реплики, так и всех реплик сервиса сразу.

**12. Как Promtail читает логи контейнеров?**
Docker по умолчанию пишет логи каждого контейнера в JSON-файл в `/var/lib/docker/containers/<id>/<id>-json.log`. Promtail читает эти файлы через Docker API.

**13. Что такое LogQL?**
Это язык запросов Loki — синтаксически похож на PromQL, но для логов. Пример: `{service="booking-service"} |= "ERROR"` — все логи сервиса, содержащие "ERROR".

**14. Почему gRPC порт = 0?**
Promtail не использует gRPC в нашей конфигурации — связь с Loki идёт по HTTP. Установка `0` отключает gRPC-listener (либо назначает случайный порт, который не используется).

**15. Что произойдёт, если Loki недоступен?**
Promtail буферизует логи в памяти и пытается переотправить. Если буфер переполнится, новые логи будут дропаться. Поэтому Loki должен быть надёжно доступен.

**16. Зачем нужна метка `logstream` (stdout/stderr)?**
Чтобы различать обычный вывод (stdout) от вывода ошибок (stderr). Это удобно для фильтрации: можно смотреть только ошибки через `{logstream="stderr"}`.

**17. Где Promtail должен быть запущен в Swarm?**
В режиме `global` — по одному экземпляру на каждом узле кластера. Каждый Promtail собирает логи только локальных контейнеров своего узла.

**18. Можно ли парсить содержимое логов?**
Да, через секцию `pipeline_stages` можно парсить JSON, извлекать поля регулярками, добавлять метки на основе содержимого. В нашем минимальном конфиге это не используется.

**19. Чем отличается label от обычного содержимого лога?**
Метки (labels) индексируются Loki и используются для быстрой фильтрации. Само содержимое лога не индексируется — поиск по нему делается линейным сканированием отфильтрованных по меткам потоков.

**20. Почему refresh_interval именно 5 секунд?**
Компромисс между отзывчивостью (быстро видеть логи новых контейнеров) и нагрузкой на Docker API. Слишком часто — лишняя нагрузка, слишком редко — задержка появления логов.