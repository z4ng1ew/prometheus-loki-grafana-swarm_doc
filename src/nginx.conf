worker_processes auto;
events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr';
    access_log /var/log/nginx/access.log main;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        location /api/v1/authorize {
            set $session_upstream "session-service:8081";
            proxy_pass http://$session_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/ {
            set $gateway_upstream "gateway-service:8087";
            proxy_pass http://$gateway_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        location /nginx-health {
            access_log off;
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }
    }
}




























# Конфигурация Nginx как reverse-proxy для микросервисной системы

## Построчный разбор с комментариями

```nginx
worker_processes auto;
# Количество worker-процессов nginx. auto = по числу CPU-ядер хоста (оптимально)

events {
    worker_connections 1024;
    # Максимум одновременных соединений на один worker-процесс
    # Общий лимит = worker_processes * worker_connections
}

http {
    # Основная секция HTTP-конфигурации
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr';
    # Кастомный формат логов с дополнительным полем upstream_addr —
    # видим, на какой реальный бэкенд был отправлен запрос (важно для отладки балансировки)

    access_log /var/log/nginx/access.log main;
    # Путь к access-логам и используемый формат "main"

    resolver 127.0.0.11 valid=10s ipv6=off;
    # КЛЮЧЕВАЯ СТРОКА: указываем DNS-резолвер для динамической резолюции имён
    # 127.0.0.11 — встроенный DNS-сервер Docker, который резолвит имена сервисов Swarm
    # valid=10s — кэшировать результат DNS-запроса 10 секунд (позволяет видеть новые реплики)
    # ipv6=off — отключаем IPv6, чтобы избежать ошибок при отсутствии IPv6-адресов

    server {
        # Виртуальный сервер
        listen 80;
        # Слушаем на порту 80 (HTTP)
        server_name _;
        # _ = catch-all, отвечаем на любой Host-заголовок (нет привязки к домену)

        location /api/v1/authorize {
            # Специальный маршрут для авторизации — идёт напрямую в session-service,
            # минуя gateway-service (оптимизация: авторизация — частая операция)
            
            set $session_upstream "session-service:8081";
            # ВАЖНО: записываем upstream в переменную через set
            # Это заставляет nginx использовать resolver для разрешения имени в runtime,
            # а не один раз при старте (как было бы с обычным proxy_pass http://session-service:8081)
            
            proxy_pass http://$session_upstream;
            # Проксируем запрос на session-service. $session_upstream резолвится через resolver
            
            proxy_set_header Host $host;
            # Передаём оригинальный Host-заголовок клиента бэкенду
            proxy_set_header X-Real-IP $remote_addr;
            # Передаём реальный IP клиента (иначе бэкенд увидит IP nginx)
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Стандартный заголовок цепочки прокси: добавляем IP клиента к существующей цепочке
        }

        location /api/ {
            # Все остальные API-запросы — на gateway-service
            
            set $gateway_upstream "gateway-service:8087";
            # Аналогично — через переменную для динамической резолюции DNS
            
            proxy_pass http://$gateway_upstream;
            # Проксируем на gateway-service
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Стандартный набор proxy-заголовков
            
            proxy_read_timeout 60s;
            # Таймаут чтения ответа от бэкенда — 60 секунд
            # Защищает от зависших запросов, но даёт время на обработку
            proxy_connect_timeout 60s;
            # Таймаут установки соединения с бэкендом — 60 секунд
        }

        location /nginx-health {
            # Health-check endpoint для проверки самого nginx
            
            access_log off;
            # Не пишем в лог — иначе health-чеки засорят логи
            
            return 200 'OK\n';
            # Возвращаем 200 OK с телом "OK\n" без обращения к бэкенду
            
            add_header Content-Type text/plain;
            # Указываем тип содержимого
        }
    }
}
```

---

## Краткий монолог для защиты

Этот конфигурационный файл превращает Nginx в reverse-proxy и единую точку входа в нашу микросервисную систему, развёрнутую в Docker Swarm. Nginx принимает HTTP-трафик на порту 80 и маршрутизирует его по двум основным направлениям: запросы на авторизацию (`/api/v1/authorize`) идут напрямую в session-service, а все остальные API-запросы (`/api/`) — в gateway-service, который уже сам распределяет их по микросервисам. Ключевая особенность конфигурации — использование встроенного Docker DNS-резолвера `127.0.0.11` через директиву `resolver` в связке с записью upstream-адресов в переменные (`set $session_upstream ...`). Это решает классическую проблему Nginx в динамических средах: без этого приёма Nginx резолвит DNS-имя сервиса только при старте и кэширует IP навсегда, из-за чего после пересоздания контейнеров (rolling update, scale) проксирование сломается. С переменными и resolver'ом Nginx перерезолвит имена каждые 10 секунд, динамически узнавая о новых VIP сервисов Swarm. Также реализован health-check endpoint `/nginx-health` для внешних проверок доступности самого балансировщика, и настроены стандартные proxy-заголовки (X-Real-IP, X-Forwarded-For) для передачи информации о реальном клиенте бэкендам.

---

## Возможные вопросы на защите и ответы

**1. Что такое reverse-proxy и чем он отличается от forward-proxy?**
Forward-proxy работает на стороне клиента, проксируя его запросы во внешний мир (как VPN). Reverse-proxy работает на стороне сервера, принимая внешние запросы и распределяя их по внутренним сервисам. Nginx здесь — reverse-proxy.

**2. Что такое 127.0.0.11 и зачем он нужен?**
Это встроенный DNS-сервер Docker, доступный из любого контейнера. Он резолвит имена сервисов Swarm в их VIP. Без указания resolver'а Nginx использует системный DNS, который не знает о Swarm-сервисах.

**3. Почему `set $upstream` + `proxy_pass http://$upstream`, а не просто `proxy_pass http://session-service:8081`?**
Когда в `proxy_pass` указано литеральное имя, Nginx резолвит его один раз при старте и кэширует IP навсегда. При изменении IP сервиса (rescale, redeploy) проксирование сломается. Использование переменной заставляет Nginx использовать `resolver` и резолвить динамически.

**4. Что такое `valid=10s` в resolver?**
Время кэширования DNS-ответа. Через 10 секунд Nginx сделает новый DNS-запрос. Чем меньше значение — тем быстрее реагирует на изменения, но больше DNS-запросов.

**5. Зачем `ipv6=off`?**
По умолчанию resolver запрашивает и A (IPv4), и AAAA (IPv6) записи. Если IPv6 не настроен, AAAA вернёт ошибку, что замедляет резолюцию или приводит к проблемам. Отключение упрощает работу.

**6. Зачем разные заголовки X-Real-IP и X-Forwarded-For?**
`X-Real-IP` — IP непосредственного клиента (одно значение). `X-Forwarded-For` — цепочка всех прокси (`клиент, прокси1, прокси2`). Бэкенды могут использовать любой из них для определения реального IP.

**7. Что такое `$proxy_add_x_forwarded_for`?**
Спецпеременная Nginx: если входящий запрос уже содержит X-Forwarded-For, она добавляет к ней IP клиента через запятую. Если нет — создаёт новый заголовок только с IP клиента.

**8. Почему авторизация идёт мимо gateway?**
Это оптимизация: авторизация — самая частая операция, и проход через gateway добавляет лишний хоп и латентность. Прямое проксирование снижает нагрузку на gateway.

**9. Зачем нужен gateway-service, если есть Nginx?**
Разные ответственности. Nginx — инфраструктурный балансировщик (TLS termination, базовая маршрутизация). Gateway — бизнес-логика API (агрегация ответов, авторизация запросов, преобразование данных, rate limiting на уровне приложения).

**10. Что произойдёт без `proxy_set_header Host $host`?**
Nginx по умолчанию подменит Host на адрес upstream'а (session-service:8081). Бэкенды могут полагаться на оригинальный Host для маршрутизации, генерации URL и т.д.

**11. Какие значения по умолчанию у `proxy_read_timeout` и `proxy_connect_timeout`?**
`proxy_connect_timeout` по умолчанию 60s, `proxy_read_timeout` — 60s. То есть в нашем случае мы явно указываем те же значения, что и дефолтные (для документирования).

**12. Что значит `access_log off` для health-check?**
Health-check'и выполняются часто (например, каждые 10 секунд), и каждый запрос писался бы в лог. Отключение access_log предотвращает засорение логов однотипными записями.

**13. Почему `listen 80`, а не HTTPS?**
В нашей конфигурации TLS не настроен (учебная среда). В production обязательно нужен HTTPS — либо терминация SSL прямо в Nginx, либо через внешний балансировщик (cloud load balancer).

**14. Как работает балансировка между репликами session-service?**
Когда `session-service:8081` резолвится в VIP сервиса, балансировку дальше делает сам Swarm через IPVS на уровне ядра. Nginx этого не видит и не контролирует.

**15. Чем отличается location `/api/` от location `/api/v1/authorize`?**
Nginx выбирает наиболее специфичный (длинный) location. Запрос `/api/v1/authorize` сматчится с `/api/v1/authorize`, а `/api/hotels` — с `/api/`. Это позволяет выделять конкретные пути.

**16. Что произойдёт при недоступности upstream'а?**
Nginx вернёт клиенту 502 Bad Gateway или 504 Gateway Timeout (в зависимости от типа ошибки). Можно настроить `proxy_next_upstream` для retry на другой бэкенд.

**17. Почему `server_name _`?**
`_` — это catch-all, Nginx не использует Host-заголовок для маршрутизации. Любой домен попадёт на этот server. В production с несколькими доменами нужна явная конфигурация.

**18. Можно ли добавить балансировку с весами?**
Да, через директиву `upstream`: `upstream backend { server srv1 weight=3; server srv2; }`. Но в Swarm это обычно не нужно — балансирует сам Swarm.

**19. Зачем `worker_processes auto`?**
Чтобы Nginx сам определил оптимальное число воркеров по количеству CPU-ядер. Это типовая оптимизация — один worker на ядро эффективно использует CPU.

**20. Что такое worker_connections?**
Максимум одновременных соединений, которые может обработать один воркер. 1024 — стандартное значение. Для high-load систем увеличивают до десятков тысяч.

**21. В чём была бы проблема без resolver при scale-операции?**
Допустим, мы сделали `docker service scale app_session-service=4`. Появились новые реплики с новыми IP. Без resolver Nginx по-прежнему шлёт трафик на старые IP, и часть запросов теряется. С resolver — через 10 секунд он узнает о новых.

**22. Что произойдёт при `docker service update`?**
Swarm делает rolling update — старые контейнеры заменяются новыми с новыми IP. Без resolver Nginx после обновления будет слать трафик на несуществующие контейнеры → 502 ошибки.

**23. Логи Nginx где находятся?**
В /var/log/nginx/access.log внутри контейнера. Чтобы они попадали в Loki через Promtail, нужно либо монтировать volume и читать файл, либо переключить логи на stdout/stderr (что обычно и делается в Docker).