## Ответы на возможные вопросы

**В: Почему `auth_enabled: false`?**
О: В учебном/однопользовательском окружении мультитенантность не нужна. При включении каждый запрос должен содержать заголовок `X-Scope-OrgID`, что усложняет настройку без реальной пользы в нашем случае.

**В: Чем Loki отличается от Elasticsearch?**
О: Loki индексирует только лейблы (метаданные), а не полный текст. Это делает его значительно легче по потреблению CPU, RAM и диска. Полнотекстовый поиск невозможен — поиск идёт по лейблам, затем фильтрация по содержимому строк.

**В: Что такое BoltDB Shipper?**
О: Это движок индексирования, основанный на встраиваемой БД BoltDB. «Shipper» означает, что индексы могут загружаться в объектное хранилище (S3/GCS) в production. В нашем случае используется filesystem.

**В: Почему `replication_factor: 1`?**
О: Развёрнут один экземпляр Loki. Репликация имеет смысл в кластерном режиме (3+ ноды). Значение 1 означает, что каждый чанк хранится в одной копии.

**В: Что такое hash-ring и зачем `inmemory`?**
О: Hash-ring — механизм распределения данных между экземплярами Loki в кластере. При одном экземпляре достаточно хранить состояние кольца в памяти. В production-кластере используется Consul или etcd.

**В: Зачем ограничивать `ingestion_rate_mb`?**
О: Для защиты Loki от перегрузки. Если приложение внезапно начнёт генерировать гигабайты логов (например, в цикле ошибок), лимит предотвратит исчерпание памяти и диска.

**В: Что такое `period: 24h` в индексе?**
О: Каждые 24 часа создаётся новый файл индекса. Это облегчает удаление старых данных (retention) и ускоряет поиск, так как Loki обращается только к индексам нужного временного диапазона.

**В: Как логи попадают в Loki?**
О: Через агенты-коллекторы, чаще всего Promtail, который читает логи из файлов или Docker-контейнеров, добавляет лейблы и отправляет в Loki по HTTP API (`POST /loki/api/v1/push`).

**В: Что будет с данными при перезапуске контейнера?**
О: Если директория `/loki` не смонтирована как Docker volume, данные будут потеряны. Для персистентности необходимо использовать `volumes` в docker-compose.