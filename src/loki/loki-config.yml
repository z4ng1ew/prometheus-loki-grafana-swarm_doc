```yaml
# ===========================
# Конфигурация Loki — системы агрегации и хранения логов
# ===========================

# Отключение мультитенантности (multi-tenancy)
# В однопользовательском/учебном окружении заголовок X-Scope-OrgID не требуется
auth_enabled: false

# Настройки HTTP-сервера Loki
server:
  # Порт, на котором Loki принимает запросы (push логов, запросы LogQL)
  http_listen_port: 3100

# Общие настройки, наследуемые всеми компонентами Loki
common:
  # Корневая директория для всех данных Loki внутри контейнера
  path_prefix: /loki
  # Конфигурация хранилища — используется локальная файловая система
  storage:
    filesystem:
      # Директория для хранения чанков (сжатых блоков логов)
      chunks_directory: /loki/chunks
      # Директория для хранения правил алертинга Loki (ruler)
      rules_directory: /loki/rules
  # Фактор репликации — 1, так как развёрнут единственный экземпляр Loki (без кластера)
  replication_factor: 1
  # Настройки hash-ring — механизма распределения данных между экземплярами
  ring:
    # Адрес текущего экземпляра в кольце (localhost, т.к. один экземпляр)
    instance_addr: 127.0.0.1
    # Хранилище состояния кольца — в оперативной памяти (без Consul/etcd)
    kvstore:
      store: inmemory

# Конфигурация схемы хранения — определяет формат индексов и хранилища объектов
schema_config:
  configs:
    # Схема действует начиная с указанной даты
    - from: 2020-10-24
      # Тип индексного хранилища — BoltDB Shipper (встроенная БД с поддержкой шардинга)
      store: boltdb-shipper
      # Тип хранилища объектов (чанков) — локальная файловая система
      object_store: filesystem
      # Версия схемы индексирования (v11 — стабильная для Loki 2.x)
      schema: v11
      # Настройки индекса
      index:
        # Префикс имён файлов индекса
        prefix: index_
        # Период ротации индекса — новый индексный файл создаётся каждые 24 часа
        period: 24h

# Лимиты на приём данных (защита от перегрузки)
limits_config:
  # Максимальная скорость приёма логов — 16 МБ/с на тенанта
  ingestion_rate_mb: 16
  # Максимальный размер всплеска (burst) при приёме — 32 МБ
  ingestion_burst_size_mb: 32

# Настройки планировщика запросов
query_scheduler:
  # Максимальное количество запросов в очереди на одного тенанта
  max_outstanding_requests_per_tenant: 4096

# Настройки фронтенда запросов (query-frontend)
frontend:
  # Максимальное количество ожидающих запросов на тенанта на уровне фронтенда
  max_outstanding_per_tenant: 4096

# Настройки аналитики (телеметрия Grafana Labs)
analytics:
  # Отключение отправки анонимной статистики использования в Grafana Labs
  reporting_enabled: false
```

---

## Монолог для защиты

Данный файл представляет собой конфигурацию Loki — системы агрегации, индексирования и хранения логов, разработанной Grafana Labs как легковесная альтернатива Elasticsearch. Ключевая архитектурная особенность Loki в том, что он индексирует только метаданные (лейблы), а не полный текст логов, что радикально снижает требования к ресурсам. В нашей конфигурации Loki развёрнут в однонодовом (single-instance) режиме: мультитенантность отключена, hash-ring хранится в памяти, фактор репликации равен единице, а все данные — чанки и индексы — хранятся на локальной файловой системе. Схема хранения использует BoltDB Shipper для индексов с ротацией каждые 24 часа, что обеспечивает эффективный поиск по временным диапазонам. Лимиты на приём (16 МБ/с, burst 32 МБ) и глубина очереди запросов (4096) настроены с запасом для учебного стенда, предотвращая отказ сервиса при всплесках нагрузки. Отключение телеметрии (`reporting_enabled: false`) гарантирует, что данные о работе системы не покидают инфраструктуру. Логи поступают в Loki от агентов Promtail, а визуализация и поиск осуществляются через Grafana с помощью языка запросов LogQL.

